# Legacy single-service backend. This folder is not included in settings.gradle;
# the active apps are the four standalone service subprojects.
spring.application.name=backend-spring-legacy
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Chỉ kiểm tra schema hiện có, tuyệt đối không tự tạo/sửa/xóa bảng.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Schema MySQL hiện dùng tên cột PascalCase như CompletedAt; giữ nguyên tên thay vì đổi thành completed_at.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
