spring.application.name=taskmind-task-service
server.port=${TASK_PORT:8082}
spring.datasource.url=jdbc:mysql://${TASK_DB_HOST:localhost}:${TASK_DB_PORT:3306}/taskmind_task_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${TASK_DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${TASK_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
spring.datasource.username=${TASK_DB_USERNAME}
spring.datasource.password=${TASK_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

taskmind.auth-url=${AUTH_SERVICE_URL:http://127.0.0.1:8081}
