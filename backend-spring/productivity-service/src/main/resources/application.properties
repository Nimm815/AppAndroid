spring.application.name=taskmind-productivity-service
server.port=${PRODUCTIVITY_PORT:8083}
spring.datasource.url=jdbc:mysql://${PRODUCTIVITY_DB_HOST:localhost}:${PRODUCTIVITY_DB_PORT:3306}/taskmind_productivity_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${PRODUCTIVITY_DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${PRODUCTIVITY_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
spring.datasource.username=${PRODUCTIVITY_DB_USERNAME}
spring.datasource.password=${PRODUCTIVITY_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.enabled=false
taskmind.auth-url=${AUTH_SERVICE_URL:http://127.0.0.1:8081}
taskmind.task-url=${TASK_SERVICE_URL:http://127.0.0.1:8082}
