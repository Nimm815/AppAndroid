spring.application.name=taskmind-ai-service
server.port=${AI_PORT:8084}
spring.datasource.url=jdbc:mysql://${AI_DB_HOST:localhost}:${AI_DB_PORT:3306}/taskmind_ai_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${AI_DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${AI_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
spring.datasource.username=${AI_DB_USERNAME}
spring.datasource.password=${AI_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.enabled=false
