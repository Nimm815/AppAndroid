spring.application.name=taskmind-auth-service
server.port=${AUTH_PORT:8081}
spring.datasource.url=jdbc:mysql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:3306}/taskmind_auth_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${AUTH_DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${AUTH_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
taskmind.avatar.directory=${AUTH_AVATAR_DIR:build/auth-avatars}
