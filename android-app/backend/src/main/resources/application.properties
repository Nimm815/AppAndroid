spring.application.name=taskmind-backend
server.port=${SERVER_PORT:8080}
# Legacy, inactive backend. Require explicit environment values to avoid
# accidentally writing to the retired task_management_app schema.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
taskmind.jwt.secret=${JWT_SECRET:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
# Replace this value with a private random secret before deploying publicly.

taskmind.jwt.expiration-ms=86400000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.address=127.0.0.1
